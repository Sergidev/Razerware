services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: razerware
      POSTGRES_PASSWORD: razerware
      POSTGRES_DB: razerware
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: